<script type="text/javascript">

    var latlng3 = new google.maps.LatLng(40.75666676799462, -73.98630881600076);

    var latlng4 = new google.maps.LatLng(-17.924656479767506, 25.856894550589708);
    var myOptions4 = {

    var myOptions5 = {
        zoom: 17,
        center: latlng5,
        mapTypeId: google.maps.MapTypeId.HYBRID
    };
    var map5 = new google.maps.Map(document.getElementById("map_canvas5"), myOptions5);

}
</script>
</head>
